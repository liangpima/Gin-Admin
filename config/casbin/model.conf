# 请求定义：sub=角色code, dom=域(固定 default), obj=API路径, act=HTTP方法
[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

# 主体直接使用角色 code 匹配（由中间件解析当前用户的角色列表后逐个校验），
# 因此不依赖 g 角色继承。obj/act 支持 "*" 通配，便于给管理员一条策略放行全部接口。
[matchers]
m = r.sub == p.sub && r.dom == p.dom && (p.obj == "*" || r.obj == p.obj) && (p.act == "*" || r.act == p.act)
